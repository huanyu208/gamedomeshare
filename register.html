<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - GameDemoShare</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, sans-serif;
        }
        body {
            background: #ffffff;
            color: #111111;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .reg-card {
            width: 100%;
            max-width: 420px;
            background: #f8f9fa;
            border-radius: 12px;
            padding: 32px 28px;
        }
        .reg-card h2 {
            text-align: center;
            margin-bottom: 24px;
            color: #111111;
        }
        .form-item {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            color: #333333;
        }
        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #e0e0e0;
            background: #ffffff;
            color: #111111;
            border-radius: 6px;
            font-size: 15px;
        }
        input:focus {
            outline: none;
            border-color: #1677ff;
        }
        .tip-text {
            font-size: 14px;
            margin: 8px 0;
            min-height:20px;
        }
        .error {
            color: #ff4d4f;
        }
        .success {
            color:#00b42a;
        }
        .btn-primary {
            width:100%;
            padding:12px;
            background:#1677ff;
            color:#ffffff;
            border:none;
            border-radius:6px;
            font-size:16px;
            cursor:pointer;
        }
        .btn-primary:disabled {
            opacity:0.45;
            cursor:not-allowed;
        }
        .link-row {
            margin-top:20px;
            text-align:center;
            font-size:14px;
            color:#888888;
        }
        .link-row a {
            color:#1677ff;
            text-decoration:none;
        }
    </style>
</head>
<body>
<div class="reg-card">
    <h2>账号注册</h2>
    <div class="form-item">
        <label>昵称</label>
        <input type="text" id="nickInput" placeholder="你的开发者昵称">
    </div>
    <div class="form-item">
        <label>邮箱</label>
        <input type="email" id="emailInput" placeholder="登录邮箱">
    </div>
    <div class="form-item">
        <label>密码</label>
        <input type="password" id="pwdInput" placeholder="设置密码（至少6位）">
    </div>
    <div class="form-item">
        <label>邀请码（选填）</label>
        <input type="text" id="inviteCodeInput" placeholder="填写邀请码可以获得额外荣誉">
    </div>
    <div id="tipBox" class="tip-text"></div>
    <button class="btn-primary" id="regBtn">注册账号</button>
    <div class="link-row">
        已有账号？<a href="login.html">去登录</a>
        <br>
        <a href="index.html">返回首页</a>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const SUPABASE_URL = "https://kczxtbmgigbfofdzkynm.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_jiyD19NDY1DEc7jVFOQzaw_I-85Ncte";
    const { createClient } = window.supabase;
    const client = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const nickInput = document.getElementById("nickInput");
    const emailInput = document.getElementById("emailInput");
    const pwdInput = document.getElementById("pwdInput");
    const inviteCodeInput = document.getElementById("inviteCodeInput");
    const regBtn = document.getElementById("regBtn");
    const tipBox = document.getElementById("tipBox");

    regBtn.onclick = async function () {
        tipBox.className = "tip-text";
        tipBox.innerText = "";
        const nickname = nickInput.value.trim();
        const email = emailInput.value.trim();
        const password = pwdInput.value;
        const inviteCode = inviteCodeInput.value.trim();

        if (!nickname) {
            tipBox.innerText = "请填写昵称";
            tipBox.classList.add("error");
            return;
        }
        if (!email) {
            tipBox.innerText = "请填写邮箱";
            tipBox.classList.add("error");
            return;
        }
        if (!password || password.length < 6) {
            tipBox.innerText = "密码至少6位";
            tipBox.classList.add("error");
            return;
        }

        regBtn.disabled = true;
        regBtn.innerText = "注册中…";
        try {
            // 1. 注册Auth账号
            const { data, error } = await client.auth.signUp({
                email,
                password,
                options: {
                    data: { nickname }
                }
            });
            if (error) throw error;
            const userId = data?.user?.id;
            if (!userId) throw new Error("注册失败，请稍后重试");

            // 2. 获取当前用户总人数，计算 registration_order、is_early_bird、display_id
            const { count:userTotal } = await client.from("profiles").select("*", { count:"exact", head:true });
            const registrationOrder = (userTotal || 0) + 1;
            const isEarlyBird = registrationOrder < 3000;
            const displayId = "GDS-" + String(registrationOrder).padStart(5,"0");

            // 3. 插入profiles基础记录
            const insertProfileObj = {
                id: userId,
                nickname: nickname,
                email: email,
                registration_order: registrationOrder,
                is_early_bird: isEarlyBird,
                display_id: displayId
            };
            const { error: profileErr } = await client.from("profiles").insert(insertProfileObj);
            if (profileErr) throw profileErr;

            // 4. 如果填写邀请码，尝试绑定invited_by + 给邀请人 invite_valid_count + 1
            if(inviteCode){
                try{
                    const {data:inviterProfile} = await client.from("profiles")
                        .select("id,invite_valid_count")
                        .eq("invite_code", inviteCode)
                        .maybeSingle();
                    if(inviterProfile && inviterProfile.id){
                        // 新用户绑定邀请人
                        await client.from("profiles")
                            .update({ invited_by: inviterProfile.id })
                            .eq("id", userId);
                        // 邀请人有效邀请数 +1
                        const currentCount = Number(inviterProfile.invite_valid_count||0);
                        await client.from("profiles")
                            .update({ invite_valid_count: currentCount + 1 })
                            .eq("id", inviterProfile.id);
                    }
                }catch(e){
                    // 邀请码查询/更新失败，不阻断注册流程
                    console.warn("邀请码绑定失败：", e);
                }
            }

            tipBox.innerText = "✅注册成功，请前往登录页面登录账号";
            tipBox.classList.add("success");

        } catch (err) {
            tipBox.innerText = "注册失败：" + err.message;
            tipBox.classList.add("error");
        } finally {
            regBtn.disabled = false;
            regBtn.innerText = "注册账号";
        }
    };
</script>
</body>
</html>
