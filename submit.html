<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>发布游戏</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, sans-serif;
        }
        body {
            background:#19192b;
            color:#eeeeee;
            max-width:720px;
            margin: 24px auto;
            padding:16px;
        }
        nav {
            display:flex;
            gap:24px;
            margin-bottom:24px;
            padding-bottom:10px;
            border-bottom:1px solid #333550;
        }
        nav a {
            color:#aaa;
            text-decoration:none;
        }
        nav a.active{
            color:#48a8ff;
            font-weight:bold;
        }
        h1{
            font-size:24px;
            margin-bottom:12px;
        }
        .tip{
            font-size:13px;
            color:#bbbbdd;
            margin-bottom:20px;
        }
        label{
            display:block;
            margin-top:12px;
        }
        .checkbox-row{
            display:flex;
            align-items:center;
            gap:8px;
            margin-top:12px;
        }
        .checkbox-row input[type="checkbox"]{
            width:auto;
            margin:0;
        }
        .hidden-block{
            display:none;
            margin-top:8px;
        }
        input,textarea,select{
            width:100%;
            background:#222238;
            border:1px solid #444470;
            color:#fff;
            padding:10px;
            border-radius:6px;
            font-size:15px;
            margin:6px 0;
        }
        textarea{
            min-height:120px;
            resize:vertical;
        }
        button{
            margin-top:16px;
            padding:10px 16px;
            border:none;
            border-radius:6px;
            cursor:pointer;
            font-size:15px;
            background:#247bdd;
            color:white;
        }
        footer {
            margin-top:40px;
            padding-top:16px;
            border-top:1px solid #333;
            color:#888;
            font-size:14px;
        }
        footer a{
            color:#61b4ff;
            font-size:13px;
            text-decoration:none;
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">首页</a>
        <a href="submit.html" class="active">发布</a>
        <a href="ranking.html">排行榜</a>
    </nav>

    <!-- 新增红色密钥警告 -->
    <div style="background:#441818;color:#ff7c7c;padding:10px 12px;border-radius:6px;margin-bottom:16px;border:1px solid #992c2c;">
⚠️ 密钥是您修改游戏的唯一凭证，不绑定账号，丢失将无法找回，请务必截图或保存在备忘录！
    </div>

    <h1>发布新游戏</h1>
    <div class="tip">填写信息提交后，生成专属编辑密钥用于后台管理</div>
    <label>游戏名称</label>
    <input id="gameName" placeholder="输入游戏名称">
    <label>开发阶段</label>
    <select id="devStageSelect">
        <option value="概念原型">概念原型</option>
        <option value="早期开发">早期开发</option>
        <option value="测试阶段">测试阶段</option>
        <option value="稳定版">稳定版</option>
    </select>
    <label>标签（逗号分隔）</label>
    <input id="gameTags" placeholder="例如：策略,独立游戏">
    <label>简介</label>
    <textarea id="gameDesc"></textarea>
    <label>开发者动态（选填）</label>
    <textarea id="devLogInput" placeholder="例如：本周修复了闪退bug，欢迎反馈"></textarea>
    <label>外部链接</label>
    <input id="gameUrl" placeholder="游戏访问地址">
    <label>版本号</label>
    <input id="gameVersion" placeholder="v0.1">
    <div class="checkbox-row">
        <input type="checkbox" id="applySponsor">
        <label for="applySponsor">申请付费曝光推广</label>
    </div>
    <div class="hidden-block" id="amountWrap">
        <label>请输入期望曝光金额（如：50元）</label>
        <input id="promoteAmountInput" placeholder="只填写数字，例：50">

        <!-- 新增：联系邮箱输入框 -->
        <label>联系邮箱（用于曝光推广沟通）</label>
        <input id="contactEmailInput" placeholder="站长将通过该邮箱和您沟通曝光合作">
    </div>
    <button id="btnSubmit">提交发布</button>
    <footer>
        <div>© 2026 GameDemoShare。仅存储外部链接，不上传游戏本体文件。</div>
        <div style="margin-top:6px;">
            <a href="edit.html">【开发者管理入口】</a>
        </div>
    </footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASEURL = "https://kczxtbmgigbfofdzkynm.supabase.co";
const SUPABASEANONKEY = "sb_publishable_jiyD19NDY1DEc7jVFOQzaw_I-85Ncte";
const { createClient } = window.supabase;
const supabaseClient = createClient(SUPABASEURL, SUPABASEANONKEY);
function getMyDemos(){
    const raw = localStorage.getItem("my_demos");
    if(!raw) return [];
    try{ return JSON.parse(raw); }catch{ return []; }
}
function saveMyDemos(arr){
    localStorage.setItem("my_demos", JSON.stringify(arr));
}
function addDemoLocal(id, edit_key, game_name){
    let list = getMyDemos();
    const exist = list.find(item => item.id === id);
    if(!exist){
        list.unshift({id, edit_key, game_name});
        saveMyDemos(list);
    }
}
const applySponsor = document.querySelector("#applySponsor");
const amountWrap = document.querySelector("#amountWrap");
applySponsor.onchange = function(){
    if(this.checked){
        amountWrap.style.display = "block";
    }else{
        amountWrap.style.display = "none";
    }
}
const btnSubmit = document.querySelector("#btnSubmit");
btnSubmit.onclick = async ()=>{
    const name = document.querySelector("#gameName").value.trim();
    const devStage = document.querySelector("#devStageSelect").value;
    const devLog = document.querySelector("#devLogInput").value.trim();
    const tags = document.querySelector("#gameTags").value.trim();
    const desc = document.querySelector("#gameDesc").value.trim();
    const url = document.querySelector("#gameUrl").value.trim();
    const ver = document.querySelector("#gameVersion").value.trim();
    const applySponsorChecked = applySponsor.checked;

    let promoteAmount = null;
    let contactEmailVal = null;

    if(applySponsorChecked){
        const val = document.querySelector("#promoteAmountInput").value.trim();
        let rawMail = document.querySelector("#contactEmailInput").value.trim();

        if(!val){
            return alert("勾选申请曝光时，请填写期望曝光金额");
        }
        promoteAmount = Number(val);
        if(isNaN(promoteAmount) || promoteAmount <=0){
            return alert("金额必须是大于0数字");
        }

        rawMail = rawMail.trim();
        if(rawMail === ""){
            return alert("勾选申请曝光后，请务必填写联系邮箱，方便站长与您沟通曝光事宜！");
        }
        if(!rawMail.includes('@') || !rawMail.includes('.')){
            return alert("请输入合法的邮箱地址，必须包含 @ 和 .");
        }
        contactEmailVal = rawMail;
    }else{
        contactEmailVal = null;
    }

    //兜底拦截：勾选曝光但是邮箱为空
    if(applySponsorChecked && !contactEmailVal){
        return alert("业务校验拦截：申请曝光必须填写联系邮箱！");
    }

    if(!name) return alert("请填写游戏名称");

    const edit_key = crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).substring(2);

    const insertObj = {
        edit_key: edit_key,
        name: name,
        dev_stage: devStage,
        dev_log: devLog || null,
        tags: tags,
        description: desc,
        external_url: url,
        version: ver,
        status: "active",
        sponsored: false,
        apply_promote: applySponsorChecked,
        promote_amount: promoteAmount,
        promote_expire: null,
        contact_email: contactEmailVal
    };

    const {data, error} = await supabaseClient.from("demos").insert([insertObj]).select();
    if(error){
        alert("发布失败:"+error.message);
        return;
    }
    const newId = data[0].id;
    addDemoLocal(newId, edit_key, name);
    alert(`发布成功！\n你的编辑密钥：${edit_key}\n请保存密钥，跳转管理面板`);
    window.location.href = `edit.html?newkey=${encodeURIComponent(edit_key)}`;
}

//修复escapeHtml >前面多余空格bug
function escapeHtml(s){
    if(!s) return "";
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
</script>
</body>
</html>
