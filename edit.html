
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>开发者自助管理</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { background:#19192b; color:#eeeeee; max-width:720px; margin: 24px auto; padding:16px; }
        nav { display:flex; gap:24px; margin-bottom:24px; padding-bottom:10px; border-bottom:1px solid #333550; }
        nav a { color:#aaa; text-decoration:none; }
        nav a.active{ color:#48a8ff; font-weight:bold; }
        h1{ font-size:24px; margin-bottom:12px; }
        .tip{ font-size:13px; color:#bbbbdd; margin-bottom:20px; }
        .stat-box{ background:#202038; padding:10px 14px; border-radius:6px; margin-bottom:16px; color:#b8d8ff; }
        .id-box{ background:#252544; padding:12px 14px; border-radius:6px; margin-bottom:18px; }
        .select-row{ display:flex; gap:8px; align-items:center; margin-bottom:10px; flex-wrap:wrap; }
        select,input,textarea{ background:#222238; border:1px solid #444470; color:#fff; padding:10px; border-radius:6px; font-size:15px; }
        select{ flex:1; }
        input,textarea{ width:100%; margin:6px 0 14px; }
        textarea{ min-height:120px; resize:vertical; }
        .btn-row{ display:flex; gap:10px; flex-wrap:wrap; margin-top:8px; }
        button{ padding:10px 16px; border:none; border-radius:6px; cursor:pointer; font-size:15px; }
        .btn-blue{ background:#247bdd; color:white; }
        .btn-orange{ background:#e28722; color:white; }
        .btn-red{ background:#d12c2c; color:white; }
        .btn-small{ padding:5px 10px; font-size:13px; }
        .status-text{ margin-bottom:12px; color:#99ccff; }
        .apply-tip{ font-size:12px; color:#ffdd88; margin:-8px 0 12px 0; }
        .checkbox-row{ display:flex; align-items:center; gap:8px; margin:8px 0 14px 0; }
        .checkbox-row input[type="checkbox"]{ width:auto; margin:0; }
        .hidden-block{ display:none; margin-top:6px; }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">首页</a>
        <a href="submit.html">发布</a>
        <a href="ranking.html">排行榜</a>
    </nav>
    <h1>开发者自助管理</h1>
    <div class="tip">下拉选择本地已保存游戏；也可粘贴外部编辑密钥找回项目</div>
    <div class="stat-box" id="statBox">📊游戏统计：未加载项目</div>
    <div class="id-box">
        <div class="select-row">
            <select id="gameSelect"><option value="">--选择本地已保存游戏--</option></select>
            <button class="btn-small btn-blue" id="btnLoad">加载选中</button>
            <button class="btn-small btn-red" id="btnLocalRemove">本地移除</button>
        </div>
        <div class="select-row">
            <input type="text" id="inputExternalKey" placeholder="粘贴外部编辑密钥找回游戏">
            <button class="btn-small btn-blue" id="btnAddExternal">添加到本地列表</button>
        </div>
        <div style="margin-top:8px;">当前编辑密钥：<span id="showEditKey"></span><button class="btn-small" id="copyKeyBtn">复制密钥</button></div>
    </div>

    <label>游戏名称（不可修改）</label>
    <input id="inputName" readonly>
    <label>开发阶段</label>
    <select id="devStageSelect">
        <option value="概念原型">概念原型</option>
        <option value="早期开发">早期开发</option>
        <option value="测试阶段">测试阶段</option>
        <option value="稳定版">稳定版</option>
    </select>
    <label>标签（逗号分隔）</label>
    <input id="inputTags" placeholder="例如：策略,独立游戏,demo">
    <label>简介描述</label>
    <textarea id="inputDesc"></textarea>
    <label>开发者动态（选填）</label>
    <textarea id="devLogInput" placeholder="例如：本周修复了闪退bug，欢迎反馈"></textarea>
    <label>外部链接</label>
    <input id="inputUrl" placeholder="游戏跳转外部URL">
    <label>版本号</label>
    <input id="inputVersion" placeholder="例如 v0.2">

    <div class="apply-tip">⚠️勾选代表向站长提交曝光申请，需要联系管理员付费后，由管理员在后台启用，开发者无法自行直接生效。</div>
    <div class="checkbox-row">
        <input type="checkbox" id="chkApplyPromote">
        <label for="chkApplyPromote">提交/撤回曝光申请</label>
    </div>
    <div class="hidden-block" id="amountWrap">
        <label>期望曝光金额（仅填写数字）</label>
        <input id="promoteAmountInput" placeholder="例：50">
        <label>联系邮箱（用于曝光推广沟通）</label>
        <input id="contactEmailInput" placeholder="站长将通过该邮箱和您沟通曝光合作">
    </div>

    <div class="status-text">当前上架状态：<span id="statusShow"></span></div>
    <div class="btn-row">
        <button class="btn-blue" id="btnSave">保存修改信息</button>
        <button class="btn-orange" id="btnToggleStatus">上架/下架切换</button>
        <button class="btn-red" id="btnDelete">彻底删除本游戏</button>
    </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASEURL = "https://kczxtbmgigbfofdzkynm.supabase.co";
const SUPABASEANONKEY = "sb_publishable_jiyD19NDY1DEc7jVFOQzaw_I-85Ncte";
const { createClient } = window.supabase;
const supabaseClient = createClient(SUPABASEURL, SUPABASEANONKEY);

function getMyDemos(){ const raw = localStorage.getItem("my_demos"); if(!raw) return []; try{ return JSON.parse(raw); }catch(e){ return []; } }
function saveMyDemos(arr){ localStorage.setItem("my_demos", JSON.stringify(arr)); }
function addExternalDemo(edit_key, game_name, id){
    let list = getMyDemos();
    const exist = list.find(x=>x.edit_key === edit_key);
    if(!exist){ list.unshift({id, edit_key, game_name}); saveMyDemos(list); }
}
function removeLocalDemoByEditKey(edit_key){
    let list = getMyDemos();
    list = list.filter(x=>x.edit_key !== edit_key);
    saveMyDemos(list);
}

let currentEditKey = "";
let demoRecord = null;

const gameSelect = document.querySelector("#gameSelect");
const btnLoad = document.querySelector("#btnLoad");
const btnLocalRemove = document.querySelector("#btnLocalRemove");
const inputExternalKey = document.querySelector("#inputExternalKey");
const btnAddExternal = document.querySelector("#btnAddExternal");
const showEditKey = document.querySelector("#showEditKey");
const copyKeyBtn = document.querySelector("#copyKeyBtn");
const inputName = document.querySelector("#inputName");
const devStageSelect = document.querySelector("#devStageSelect");
const devLogInput = document.querySelector("#devLogInput");
const inputTags = document.querySelector("#inputTags");
const inputDesc = document.querySelector("#inputDesc");
const inputUrl = document.querySelector("#inputUrl");
const inputVersion = document.querySelector("#inputVersion");
const chkApplyPromote = document.querySelector("#chkApplyPromote");
const amountWrap = document.querySelector("#amountWrap");
const promoteAmountInput = document.querySelector("#promoteAmountInput");
const inputContactEmail = document.querySelector("#contactEmailInput");
const statusShow = document.querySelector("#statusShow");
const btnSave = document.querySelector("#btnSave");
const btnToggleStatus = document.querySelector("#btnToggleStatus");
const btnDelete = document.querySelector("#btnDelete");
const statBox = document.querySelector("#statBox");

chkApplyPromote.onchange = function(){ amountWrap.style.display = this.checked ? "block" : "none"; }

async function loadGameStats(demoId){
    const {data:demoData} = await supabaseClient.from("demos").select("view_count").eq("id",demoId).single();
    const {data:cmtList} = await supabaseClient.from("comments").select("star").eq("demo_id",demoId);
    const viewCount = demoData?.view_count ?? 0;
    let reviewCount = 0, avgStar = "暂无";
    if(cmtList && cmtList.length>0){
        reviewCount = cmtList.length;
        const sum = cmtList.reduce((s,i)=>s+i.star,0);
        avgStar = (sum/reviewCount).toFixed(1);
    }
    statBox.innerText = `📊游戏统计：👀浏览量：${viewCount} | ⭐评价数：${reviewCount} | 平均分：${avgStar}`;
}

function renderSelect(){
    gameSelect.innerHTML = `<option value="">--选择本地已保存游戏--</option>`;
    getMyDemos().forEach(item=>{
        const opt = document.createElement('option');
        opt.value = item.edit_key;
        opt.innerText = `${item.game_name} | ${item.edit_key}`;
        if(item.edit_key === currentEditKey) opt.selected = true;
        gameSelect.appendChild(opt);
    })
}

function clearForm(){
    demoRecord = null; currentEditKey = ""; statBox.innerText = "📊游戏统计：未加载项目";
    showEditKey.innerText = "未选中"; inputName.value = ""; devStageSelect.value = "概念原型";
    devLogInput.value = ""; inputTags.value = ""; inputDesc.value = ""; inputUrl.value = "";
    inputVersion.value = ""; inputContactEmail.value = ""; chkApplyPromote.checked = false;
    amountWrap.style.display = "none"; promoteAmountInput.value = ""; statusShow.innerText = "";
}

async function loadByEditKey(edit_key){
    const {data, error} = await supabaseClient.from("demos").select("*").eq("edit_key", edit_key).maybeSingle();
    if(error || !data){ alert("找不到该编辑密钥对应的游戏，请核对"); clearForm(); return false; }
    demoRecord = data; currentEditKey = edit_key; showEditKey.innerText = currentEditKey;
    inputName.value = data.name; devStageSelect.value = data.dev_stage || "概念原型"; devLogInput.value = data.dev_log || "";
    inputTags.value = data.tags || ""; inputDesc.value = data.description || ""; inputUrl.value = data.external_url || "";
    inputVersion.value = data.version || ""; inputContactEmail.value = data.contact_email || "";
    chkApplyPromote.checked = !!data.apply_promote;
    if(data.promote_amount !== null && data.promote_amount !== undefined){ promoteAmountInput.value = String(data.promote_amount); }else{ promoteAmountInput.value = ""; }
    amountWrap.style.display = chkApplyPromote.checked ? "block" : "none";
    statusShow.innerText = data.status; await loadGameStats(data.id); return true;
}

copyKeyBtn.onclick = async ()=>{ if(!currentEditKey) return alert("暂无编辑密钥"); await navigator.clipboard.writeText(currentEditKey); alert("密钥已复制"); }
btnLoad.onclick = async ()=>{ const selKey = gameSelect.value; if(!selKey) return alert("请下拉选择游戏"); await loadByEditKey(selKey); renderSelect(); }
btnLocalRemove.onclick = ()=>{
    const selKey = gameSelect.value;
    if(!selKey) return alert("请选择要移除的项目");
    if(!confirm("确认仅从本地列表移除，不会删除云端游戏记录？")) return;
    removeLocalDemoByEditKey(selKey);
    if(currentEditKey === selKey) clearForm();
    renderSelect();
}

btnAddExternal.onclick = async ()=>{
    const ek = inputExternalKey.value.trim();
    if(!ek) return alert("粘贴编辑密钥");
    const {data, error} = await supabaseClient.from("demos").select("*").eq("edit_key", ek).maybeSingle();
    if(error || !data){ alert("密钥不存在！"); return; }
    addExternalDemo(ek, data.name, data.id); inputExternalKey.value = "";
    await loadByEditKey(ek); renderSelect();
}

btnSave.onclick = async ()=>{
    if(!demoRecord) return alert("未加载游戏记录");
    let promAmount = null;
    let contactEmailVal = null;

    if(chkApplyPromote.checked){
        const val = promoteAmountInput.value.trim();
        let rawMail = inputContactEmail.value.trim();
        if(!val) return alert("勾选申请曝光时，请填写期望曝光金额");
        promAmount = Number(val);
        if(isNaN(promAmount) || promAmount <= 0) return alert("金额必须是大于0数字");
        if(rawMail === "") return alert("勾选申请曝光后，请务必填写联系邮箱，方便站长与您沟通曝光事宜！");
        if(!rawMail.includes('@') || !rawMail.includes('.')) return alert("请输入合法的邮箱地址，必须包含 @ 和 .");
        contactEmailVal = rawMail;
    }
    if(chkApplyPromote.checked && !contactEmailVal) return alert("业务校验拦截：申请曝光必须填写联系邮箱！");

    const updateObj = {
        dev_stage: devStageSelect.value, dev_log: devLogInput.value.trim() || null,
        contact_email: contactEmailVal || null, tags: inputTags.value.trim(),
        description: inputDesc.value.trim(), external_url: inputUrl.value.trim(),
        version: inputVersion.value.trim(), apply_promote: chkApplyPromote.checked,
        promote_amount: promAmount
    };
    const {error} = await supabaseClient.from("demos").update(updateObj).eq("id", demoRecord.id);
    if(error){ alert("保存失败："+error.message); }else{ alert("✅保存成功"); await loadByEditKey(currentEditKey); }
}

btnToggleStatus.onclick = async ()=>{
    if(!demoRecord) return alert("请先加载游戏");
    const newStatus = demoRecord.status === "active" ? "inactive" : "active";
    const {error} = await supabaseClient.from("demos").update({status:newStatus}).eq("id", demoRecord.id);
    if(error){ alert("切换失败："+error.message); }else{ alert("✅状态切换完成"); await loadByEditKey(currentEditKey); }
}

btnDelete.onclick = async ()=>{
    if(!demoRecord) return alert("未加载游戏记录");
    if(!confirm("⚠️确认永久删除云端游戏，不可恢复！")) return;
    const {error} = await supabaseClient.from("demos").delete().eq("id", demoRecord.id);
    if(error){ alert("删除失败："+error.message); }else{ alert("✅游戏已删除"); removeLocalDemoByEditKey(currentEditKey); clearForm(); renderSelect(); }
}

(async ()=>{
    renderSelect();
    const params = new URLSearchParams(window.location.search);
    const newKey = params.get("newkey");
    if(newKey){
        const {data, error} = await supabaseClient.from("demos").select("*").eq("edit_key", newKey).maybeSingle();
        if(!error && data){ addExternalDemo(newKey, data.name, data.id); await loadByEditKey(newKey); renderSelect(); }
        window.history.replaceState({}, document.title, window.location.pathname);
    }
})();

function escapeHtml(s){ if(!s) return ""; return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
</script>
</body>
</html>
