<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>重置密码 - GameDemoShare</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, sans-serif;
        }
        body {
            background: #ffffff;
            color: #111111;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .reset-card {
            width: 100%;
            max-width: 420px;
            background: #f8f9fa;
            border-radius: 12px;
            padding: 32px 28px;
        }
        .reset-card h2 {
            text-align: center;
            margin-bottom: 24px;
            color: #111111;
        }
        .form-item {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            color: #333333;
        }
        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #e0e0e0;
            background: #ffffff;
            color: #111111;
            border-radius: 6px;
            font-size: 15px;
        }
        input:focus {
            outline: none;
            border-color: #1677ff;
        }
        .tip-text {
            font-size: 14px;
            margin: 8px 0;
            min-height:20px;
        }
        .error {
            color: #ff4d4f;
        }
        .success {
            color:#00b42a;
        }
        .btn-primary {
            width:100%;
            padding:12px;
            background:#1677ff;
            color:#ffffff;
            border:none;
            border-radius:6px;
            font-size:16px;
            cursor:pointer;
        }
        .btn-primary:disabled {
            opacity:0.45;
            cursor:not-allowed;
        }
        .link-row {
            margin-top:20px;
            text-align:center;
            font-size:14px;
            color:#888888;
        }
        .link-row a {
            color:#1677ff;
            text-decoration:none;
        }
    </style>
</head>
<body>
<div class="reset-card">
    <h2>重置密码</h2>
    <div id="pageContent">
        <div class="form-item">
            <label>新密码</label>
            <input type="password" id="newPwdInput" placeholder="请设置新密码，至少6位">
        </div>
        <div class="form-item">
            <label>确认新密码</label>
            <input type="password" id="confirmPwdInput" placeholder="再次输入新密码">
        </div>
        <div id="tipBox" class="tip-text"></div>
        <button class="btn-primary" id="submitResetBtn">确认修改</button>
    </div>
    <div id="invalidTip" style="display:none;">
        <div class="tip-text error" style="text-align:center;font-size:16px;">无效的重置链接，请重新申请</div>
        <div class="link-row">
            <a href="login.html">前往登录页</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const SUPABASE_URL = "https://kczxtbmgigbfofdzkynm.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_jiyD19NDY1DEc7jVFOQzaw_I-85Ncte";
    const { createClient } = window.supabase;
    const client = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const pageContent = document.getElementById("pageContent");
    const invalidTip = document.getElementById("invalidTip");
    const newPwdInput = document.getElementById("newPwdInput");
    const confirmPwdInput = document.getElementById("confirmPwdInput");
    const submitResetBtn = document.getElementById("submitResetBtn");
    const tipBox = document.getElementById("tipBox");

    (async function init(){
        // 解析url hash，supabase重置跳转携带 #access_token
        const {data:{session}} = await client.auth.getSession();
        if(!session){
            // 没有重置会话，展示无效提示，隐藏表单
            pageContent.style.display = "none";
            invalidTip.style.display = "block";
            return;
        }
        // 会话有效，显示重置表单
        pageContent.style.display = "block";
        invalidTip.style.display = "none";
    })();

    submitResetBtn.onclick = async function(){
        tipBox.className = "tip-text";
        tipBox.innerText = "";
        const newPwd = newPwdInput.value;
        const confirmPwd = confirmPwdInput.value;

        if(!newPwd || newPwd.length <6){
            tipBox.innerText = "新密码至少6位";
            tipBox.classList.add("error");
            return;
        }
        if(newPwd !== confirmPwd){
            tipBox.innerText = "两次输入的密码不一致";
            tipBox.classList.add("error");
            return;
        }

        submitResetBtn.disabled = true;
        try{
            const {error} = await client.auth.updateUser({
                password: newPwd
            });
            if(error) throw error;
            alert("密码重置成功，即将跳转登录页");
            // 清除本地会话，跳转到登录页面
            await client.auth.signOut();
            window.location.href = "login.html";
        }catch(err){
            tipBox.innerText = "重置密码失败：" + err.message;
            tipBox.classList.add("error");
        }finally{
            submitResetBtn.disabled = false;
        }
    };
</script>
</body>
</html>
